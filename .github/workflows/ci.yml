name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    # Cold ffmpeg installs can exceed ten minutes before the test suite starts.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      # Every layer that makes no live call: unit, contract, replay, the memory simulator, the fixed gates, and the
      # Restart, Migration, Disk Full and Restore suites (docs/trd/harness.md#fixed-gates).
      - name: Install ffmpeg and ffprobe for media contract tests
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: bun run test
      - run: python3 -m unittest discover -s tests/cli -p 'test_*.py'
      - name: Verify the standalone adapter registries agree
        run: |
          python_versions="$(python3 -c 'import json
          from deploy.cli.hermes_versions import ADAPTER_VERSIONS
          print(json.dumps(ADAPTER_VERSIONS, separators=(",", ":")))')"
          core_versions="$(bun -e 'import { STANDALONE_ADAPTER_VERSIONS } from "./src/gateway/standalone.ts";
          console.log(JSON.stringify(STANDALONE_ADAPTER_VERSIONS))')"
          test "$python_versions" = "$core_versions"

  site:
    runs-on: ubuntu-24.04
    # A cold Linux browser install can take nine minutes before the suite starts.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The owner site (docs/trd/deployment.md#ci): typecheck and build.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Install ffmpeg and ffprobe for dashboard portrait uploads
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install browser test dependencies
        working-directory: .
        run: bun install --frozen-lockfile && bunx playwright install --with-deps chromium firefox webkit
      - name: Verify the built dashboard through the core listener
        working-directory: .
        run: bun run test:dashboard

  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan repository history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'

  image-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ARCH: ${{ matrix.arch }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load the native candidate
        id: native-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          build-args: AIRA_BUILD_SHA=${{ github.sha }}
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: aira-onboarding-candidate:${{ env.SHORT_SHA }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Verify native architecture and pinned binaries
        env:
          BUILD_METADATA: ${{ steps.native-build.outputs.metadata }}
        run: |
          candidate="aira-onboarding-candidate:${SHORT_SHA}"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$candidate")" = "linux/$ARCH"
          image_id="$(docker image inspect --format '{{.Id}}' "$candidate")"
          config="$(jq -er '.["containerimage.config.digest"]' <<< "$BUILD_METADATA")"
          [[ "$image_id" =~ ^sha256:[a-f0-9]{64}$ && "$config" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'TESTED_IMAGE_ID=%s\nTESTED_CONFIG_DIGEST=%s\n' "$image_id" "$config" >> "$GITHUB_ENV"
          docker run --rm --network none --entrypoint sh "$candidate" -ec \
            'node --version; yt-dlp --version; typst --version; restic version; ffmpeg -version'

      - name: Refuse remote contexts and non-native Docker platforms before provisioning
        run: |
          refused="$RUNNER_TEMP/aira-remote-refusal"
          verify_refusal() {
            if "$@" ./aira setup --home "$refused" --no-open --json --non-interactive \
              --image "aira-onboarding-candidate:${SHORT_SHA}" > "$RUNNER_TEMP/refusal.json"; then
              echo '::error::Unsupported Docker context or platform was incorrectly accepted.'
              exit 1
            fi
            jq -e '.outcome == "error" and .error.code == "unsupported_platform" and .error.stage == "preflight"' \
              "$RUNNER_TEMP/refusal.json" > /dev/null
            test ! -e "$refused"
          }
          verify_refusal env -u DOCKER_CONTEXT DOCKER_HOST=tcp://127.0.0.1:9
          docker context create aira-refusal-fixture --docker 'host=tcp://127.0.0.1:9'
          trap 'docker context rm aira-refusal-fixture' EXIT
          verify_refusal env DOCKER_CONTEXT=aira-refusal-fixture DOCKER_HOST=unix:///var/run/docker.sock
          if [ "$ARCH" = amd64 ]; then foreign=arm64; else foreign=amd64; fi
          verify_refusal env -u DOCKER_CONTEXT DOCKER_HOST=unix:///var/run/docker.sock \
            DOCKER_DEFAULT_PLATFORM="linux/$foreign"

      - name: Check out the supported Hermes version for synthetic QA
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: 8fc0374447313e276f6b9a2764bfc750190c966a
          path: hermes-fixture
          persist-credentials: false

      - name: Check out Hermes v0.23.3 candidate for synthetic QA
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: caafe5389ae585ef77387a962aee05b1bcf17029
          path: hermes-fixture-0233
          persist-credentials: false

      - name: Check out Hermes v0.23.2 candidate for synthetic QA
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: ae2a81ccc00e9b7c06301523e5bb09608397149c
          path: hermes-fixture-0232
          persist-credentials: false

      - name: Check out the baseline for previous-core rollback QA
        if: matrix.arch == 'amd64'
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: 8fc0374447313e276f6b9a2764bfc750190c966a
          path: hermes-fixture-legacy
          persist-credentials: false

      - name: Install the pinned public fixture dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/aira-uv"
          "$RUNNER_TEMP/aira-uv/bin/pip" install uv==0.11.26
          suffixes=('' -0233 -0232)
          if [ "$ARCH" = amd64 ]; then suffixes+=(-legacy); fi
          for suffix in "${suffixes[@]}"; do
            profile="$RUNNER_TEMP/aira-hermes-profile${suffix}"
            mkdir -m 700 "$profile"
            printf 'gateway:\n  multiplex_profiles: false\n' > "$profile/config.yaml"
            fixture="$GITHUB_WORKSPACE/hermes-fixture${suffix}"
            if [ -z "$suffix" ] || [ "$suffix" = -legacy ]; then
              mv "$fixture" "$profile/hermes-agent"
              fixture="$profile/hermes-agent"
              git -C "$fixture" fetch --depth=1 origin ae2a81ccc00e9b7c06301523e5bb09608397149c
            fi
            (cd "$fixture" && "$RUNNER_TEMP/aira-uv/bin/uv" sync --locked --python 3.14 --group dev --extra messaging)
          done

      - name: Exercise exact image install, update, rollback and restore
        run: |
          CANDIDATE="aira-onboarding-candidate:${SHORT_SHA}"
          NEXT="aira-onboarding-next:${SHORT_SHA}"
          BAD="aira-onboarding-bad:${SHORT_SHA}"
          fixture="$(docker create "$CANDIDATE")"
          docker commit --change 'LABEL io.tolonglabs.aira.fixture=next' "$fixture" "$NEXT"
          docker rm -v "$fixture"
          fixture="$(docker create "$NEXT")"
          printf 'process.exit(1)\n' > "$RUNNER_TEMP/aira-probe-failure.js"
          docker cp "$RUNNER_TEMP/aira-probe-failure.js" "$fixture:/app/dist/scripts/deploy-turn-probe.js"
          docker commit "$fixture" "$BAD"
          docker rm -v "$fixture"
          profile="$RUNNER_TEMP/aira-hermes-profile"
          python3 tests/install/smoke.py --image "$CANDIDATE" --home "$RUNNER_TEMP/aira-install" \
            --hermes-dir "$profile/hermes-agent" --hermes-home "$profile" \
            --migration-ref ae2a81ccc00e9b7c06301523e5bb09608397149c --migration-version hermes-v0.23.2 \
            --uv-bin "$RUNNER_TEMP/aira-uv/bin/uv" \
            --update-image "$NEXT" --bad-image "$BAD"

      - name: Exercise additional exact stock attachments
        run: |
          for minor in 3 2; do
            suffix="-023${minor}"
            python3 tests/install/smoke.py --image "aira-onboarding-candidate:${SHORT_SHA}" \
              --home "$RUNNER_TEMP/aira-install${suffix}" \
              --hermes-dir "$GITHUB_WORKSPACE/hermes-fixture${suffix}" \
              --hermes-home "$RUNNER_TEMP/aira-hermes-profile${suffix}" \
              --adapter-version "hermes-v0.23.${minor}"
          done

      - name: Verify exact rollback against the previous released core
        if: matrix.arch == 'amd64'
        run: |
          previous="ghcr.io/tolonglabs/aira@sha256:bf8f61ee7916f91d8c109354c96591f5db157f52c5153a7f94793ed3ab20d5bc"
          docker pull "$previous"
          docker tag "$previous" aira-onboarding-previous:fixture
          profile="$RUNNER_TEMP/aira-hermes-profile-legacy"
          python3 tests/install/smoke.py --image aira-onboarding-previous:fixture \
            --home "$RUNNER_TEMP/aira-install-legacy" --hermes-dir "$profile/hermes-agent" --hermes-home "$profile" \
            --migration-ref ae2a81ccc00e9b7c06301523e5bb09608397149c --migration-version hermes-v0.23.2 \
            --uv-bin "$RUNNER_TEMP/aira-uv/bin/uv" --expect-migration-rejection

      - name: Verify the actual pinned Hermes admission and delivery pipelines
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          for suffix in '' -0233 -0232; do
            fixture="$GITHUB_WORKSPACE/hermes-fixture${suffix}"
            if [ -z "$suffix" ]; then fixture="$RUNNER_TEMP/aira-hermes-profile/hermes-agent"; fi
            cp tests/install/hermes_fixture.py "$fixture/tests/gateway/test_aira_transport_spike.py"
            cp tests/install/hermes_bridge_fixture.py "$fixture/tests/gateway/test_aira_bridge_fixture.py"
            cp tests/install/hermes_capabilities_fixture.py "$fixture/tests/gateway/test_aira_capabilities_fixture.py"
            (cd "$fixture" && .venv/bin/pytest -q \
              tests/gateway/test_aira_transport_spike.py tests/gateway/test_aira_bridge_fixture.py \
              tests/gateway/test_aira_capabilities_fixture.py tests/gateway/test_whatsapp_group_gating.py \
              tests/gateway/test_whatsapp_media_path_profile.py)
          done

      - name: Log in to GHCR after the native tests pass
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and prove the tested native child
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image='ghcr.io/tolonglabs/aira'
          candidate="aira-onboarding-candidate:${SHORT_SHA}"
          child="$image:sha-${SHORT_SHA}-${ARCH}"
          platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$candidate")"
          test "$platform" = "linux/$ARCH"
          test "$(docker image inspect --format '{{.Id}}' "$candidate")" = "$TESTED_IMAGE_ID"
          config="$TESTED_CONFIG_DIGEST"
          docker tag "$TESTED_IMAGE_ID" "$child"
          media="$(docker image inspect "$child" | jq -r '.[0].Descriptor.mediaType // empty')"
          case "$media" in
            application/vnd.oci.image.index.v1+json|application/vnd.docker.distribution.manifest.list.v2+json)
              docker push --platform "$platform" "$child" ;;
            *) docker push "$child" ;;
          esac
          digest="$(docker buildx imagetools inspect "$child" --format '{{json .Manifest.Digest}}' | jq -er .)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ && "$config" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools inspect "$image@$digest" --raw | \
            jq -e --arg config "$config" '.schemaVersion == 2 and .config.digest == $config' > /dev/null
          docker logout ghcr.io
          docker pull --platform "$platform" "$image@$digest"
          pulled_id="$(docker image inspect --format '{{.Id}}' "$image@$digest")"
          [[ "$pulled_id" = "$config" || "$pulled_id" = "$digest" ]]
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image@$digest")" = "$platform"
          docker image inspect --format '{{json .RepoDigests}}' "$image@$digest" | \
            jq -e --arg ref "$image@$digest" 'index($ref) != null' > /dev/null
          jq -n --arg commit "$GITHUB_SHA" --arg platform "$platform" --arg imageId "$TESTED_IMAGE_ID" \
            --arg configDigest "$config" --arg manifestDigest "$digest" \
            '{$commit,$platform,$imageId,$configDigest,$manifestDigest}' \
            > "$RUNNER_TEMP/image-proof.json"

      - name: Upload exact tested native proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: image-proof-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-proof.json
          if-no-files-found: error
          retention-days: 7

  image:
    needs: [image-platform]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require every native image job
        env:
          RESULT: ${{ needs.image-platform.result }}
        run: |
          [ "$RESULT" = success ] || { echo "::error::Native image matrix finished as $RESULT"; exit 1; }

      - uses: actions/checkout@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          pattern: image-proof-*
          path: ${{ runner.temp }}/image-proofs

      - uses: docker/setup-buildx-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - uses: docker/login-action@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble only the exact tested native children
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image='ghcr.io/tolonglabs/aira'
          sha_tag="$image:sha-${GITHUB_SHA::7}"
          proofs="$RUNNER_TEMP/image-proofs"
          proof="$(python3 scripts/native_image_proof.py --commit "$GITHUB_SHA" --proofs "$proofs")"
          children=()
          for arch in amd64 arm64; do
            digest="$(jq -er --arg platform "linux/$arch" '.[$platform].manifestDigest' <<< "$proof")"
            config="$(jq -er --arg platform "linux/$arch" '.[$platform].configDigest' <<< "$proof")"
            docker buildx imagetools inspect "$image@$digest" --raw | \
              jq -e --arg config "$config" '.schemaVersion == 2 and .config.digest == $config' > /dev/null
            children+=("$image@$digest")
          done
          docker buildx imagetools create -t "$sha_tag" -t "$image:edge" "${children[@]}"
          docker logout ghcr.io
          docker buildx imagetools inspect "$sha_tag" --raw > "$RUNNER_TEMP/image-index.json"
          python3 scripts/native_image_proof.py --commit "$GITHUB_SHA" --proofs "$proofs" \
            --index "$RUNNER_TEMP/image-index.json" > /dev/null
          digest="$(docker buildx imagetools inspect "$sha_tag" --format '{{json .Manifest.Digest}}' | jq -er .)"
          edge_digest="$(docker buildx imagetools inspect "$image:edge" \
            --format '{{json .Manifest.Digest}}' | jq -er .)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ && "$digest" = "$edge_digest" ]]
          docker pull "$sha_tag"
          pulled_id="$(docker image inspect --format '{{.Id}}' "$sha_tag")"
          amd64_config="$(jq -er '.["linux/amd64"].configDigest' <<< "$proof")"
          amd64_manifest="$(jq -er '.["linux/amd64"].manifestDigest' <<< "$proof")"
          [[ "$pulled_id" = "$amd64_config" || "$pulled_id" = "$amd64_manifest" || "$pulled_id" = "$digest" ]]
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$sha_tag")" = linux/amd64
          docker image inspect --format '{{json .RepoDigests}}' "$sha_tag" | \
            jq -e --arg ref "$image@$digest" 'index($ref) != null' > /dev/null

  images-ok:
    needs: [image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Image build passed
        env:
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          [ "$IMAGE_RESULT" = success ] || { echo "::error::Image build finished as $IMAGE_RESULT"; exit 1; }
          echo "Image build passed"

  deploy:
    needs: [check, site, scan, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, aira-dev2]
    # A named environment makes each run a GitHub deployment, listed on the repository page.
    environment:
      name: production
    # Worst case is lock wait plus a full pull budget plus the health and snapshot polls.
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: aira-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Bun comes from the runner's tool cache; nothing is installed on the host itself.
      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile --production --ignore-scripts

      - name: Install the gateway directory mirror
        run: |
          install -Dm644 deploy/host/sync-directory.py "$HOME/.local/lib/aira/sync-directory.py"
          install -Dm644 deploy/host/aira-directory.service "$HOME/.config/systemd/user/aira-directory.service"
          install -Dm644 deploy/host/aira-directory.path "$HOME/.config/systemd/user/aira-directory.path"
          install -Dm755 deploy/host/owner-api-bridge.sh "$HOME/.local/lib/aira/owner-api-bridge.sh"
          install -Dm644 deploy/host/aira-owner-api.socket "$HOME/.config/systemd/user/aira-owner-api.socket"
          install -Dm644 deploy/host/aira-owner-api.service "$HOME/.config/systemd/user/aira-owner-api.service"
          install -Dm644 deploy/host/model-probe.py "$HOME/.local/lib/aira/model-probe.py"
          install -Dm644 deploy/host/aira-model-probe.socket "$HOME/.config/systemd/user/aira-model-probe.socket"
          install -Dm644 deploy/host/aira-model-probe@.service "$HOME/.config/systemd/user/aira-model-probe@.service"
          bun build scripts/dashboard-settings-host.ts --target=node --format=esm --outfile="$RUNNER_TEMP/aira-dashboard-settings.mjs"
          install -Dm644 "$RUNNER_TEMP/aira-dashboard-settings.mjs" "$HOME/.local/lib/aira/dashboard-settings.mjs"
          install -Dm644 deploy/host/aira-settings.socket "$HOME/.config/systemd/user/aira-settings.socket"
          install -Dm644 deploy/host/aira-settings.service "$HOME/.config/systemd/user/aira-settings.service"
          systemctl --user daemon-reload
          systemctl --user enable --now aira-directory.path aira-owner-api.socket aira-model-probe.socket aira-settings.socket
          systemctl --user try-restart aira-settings.service
          systemctl --user start aira-directory.service

      - name: Deploy on host
        env:
          SECRET_NTFY_URL: ${{ secrets.AIRA_NTFY_URL }}
        run: |
          if [ -n "$SECRET_NTFY_URL" ]; then export AIRA_NTFY_URL="$SECRET_NTFY_URL"; fi
          bun scripts/deploy-host.ts --version "sha-${GITHUB_SHA::7}" --install "$HOME/aira"
