name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      # Every layer that makes no live call: unit, contract, replay, the memory simulator, the fixed gates, and the
      # Restart, Migration, Disk Full and Restore suites (docs/trd/harness.md#fixed-gates).
      - run: bun run test

  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The owner site (docs/trd/deployment.md#ci): typecheck and build.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan repository history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/tolonglabs/aira:sha-${{ env.SHORT_SHA }}
            ghcr.io/tolonglabs/aira:edge
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The host pulls without logging in, so a private package would break every deploy silently.
      - name: Check anonymous pulls work
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker logout ghcr.io
          IMAGE="ghcr.io/tolonglabs/aira"
          if ! docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}" > /dev/null; then
            echo "::error::$IMAGE is not publicly pullable. Set the package to Public: GitHub > Packages > aira > Package settings > Change visibility."
            exit 1
          fi

  images-ok:
    needs: [image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Image build passed
        env:
          IMAGE_RESULT: ${{ needs.image.result }}
        run: |
          [ "$IMAGE_RESULT" = success ] || { echo "::error::Image build finished as $IMAGE_RESULT"; exit 1; }
          echo "Image build passed"

  deploy:
    needs: [check, scan, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, aira-dev2]
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: aira-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Bun comes from the runner's tool cache; nothing is installed on the host itself.
      - uses: oven-sh/setup-bun@v2

      - name: Deploy on host
        env:
          SECRET_NTFY_URL: ${{ secrets.AIRA_NTFY_URL }}
        run: |
          if [ -n "$SECRET_NTFY_URL" ]; then export AIRA_NTFY_URL="$SECRET_NTFY_URL"; fi
          bun scripts/deploy-host.ts --version "sha-${GITHUB_SHA::7}" --install "$HOME/aira"
