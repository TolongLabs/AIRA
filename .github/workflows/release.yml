name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      HAS_APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      major: ${{ steps.rp.outputs.major }}
      minor: ${{ steps.rp.outputs.minor }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      # A PR opened with GITHUB_TOKEN never triggers CI, so the release App's token opens it
      # (docs/references/git-workflow.md#release-pull-requests). Without the App the fallback still runs.
      - id: app-token
        if: vars.RELEASE_APP_ID != '' && env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  promote:
    needs: [release]
    if: needs.release.outputs.created == 'true' && needs.release.outputs.sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Wait for the exact release commit's CI to pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 120); do
            state="$(gh run list --workflow ci.yml --event push --commit "$GITHUB_SHA" --limit 5 \
              --json status,conclusion --jq '.[0] | if . == null then "pending" elif .status == "completed" then .conclusion else "pending" end')"
            if [ "$state" = success ]; then exit 0; fi
            if [ "$state" != pending ] && [ -n "$state" ]; then
              echo "::error::Release commit CI finished as $state; stable was not promoted."
              exit 1
            fi
            sleep 30
          done
          echo "::error::Release commit CI did not pass within 60 minutes."
          exit 1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-tags the image the host already builds for this commit; nothing is rebuilt.
      - name: Tag the release
        env:
          TAG: ${{ needs.release.outputs.tag }}
          MAJOR: ${{ needs.release.outputs.major }}
          MINOR: ${{ needs.release.outputs.minor }}
        run: |
          IMAGE="ghcr.io/tolonglabs/aira"
          SRC="$IMAGE:sha-${GITHUB_SHA::7}"
          for i in $(seq 1 80); do
            if docker buildx imagetools inspect "$SRC" > /dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 80 ]; then
              echo "::error::$SRC did not appear in GHCR within 20 minutes"
              exit 1
            fi
            sleep 15
          done
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" -t "$IMAGE:v$MAJOR.$MINOR" -t "$IMAGE:stable" \
            "$SRC"
          test "$(docker buildx imagetools inspect "$IMAGE:stable" --format '{{json .Manifest.Digest}}')" = \
               "$(docker buildx imagetools inspect "$SRC" --format '{{json .Manifest.Digest}}')"
