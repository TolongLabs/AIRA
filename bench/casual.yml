name: casual
description: Short everyday chat messages that need no tool
prompts:
  - hey, how is your day going?
  - morning! ready for a quiet weekend?
  - what kind of music helps you focus?
  - tell me a short joke to start the afternoon
  - why does rain always seem to bring a calm mood?
  - do you prefer tea or coffee in the morning?
  - give me a quick dinner idea with just pasta and garlic
  - what makes a good book hard to put down?
  - how do people stay energized on a cloudy day?
  - name one small habit that makes mornings easier
  - if you could learn any instrument in a week, which one?
  - thanks for the chat, talk soon!
