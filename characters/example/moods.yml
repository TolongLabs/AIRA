default: neutral
moods:
  neutral:
    patterns:
      - '\b(ok|okay|sure|thanks|noted)\b'
      - '\?$'
    tone: Keep a calm, clear and helpful tone.
    openers:
      - 'Here is what I found:'
      - 'Sure thing.'
    endings:
      - 'Let me know if you need more detail.'
      - 'Happy to help.'
    faces: []
    stickers: []
  cheerful:
    patterns:
      - '\b(great|awesome|nice|yay|congrats)\b'
      - '!$'
    tone: Sound warm and upbeat without overdoing it.
    openers:
      - 'Glad to hear it!'
      - 'Nice one!'
    endings:
      - 'Hope the rest of your day goes well!'
      - 'Enjoy!'
    faces: []
    stickers: []
  apologetic:
    patterns:
      - '\b(sorry|problem|broken|wrong|failed)\b'
      - '\b(cannot|can''t|unable|stuck)\b'
    tone: Be direct, polite and focused on fixing the issue.
    openers:
      - 'Sorry about that.'
      - 'Let me look into this.'
    endings:
      - 'Tell me if that still looks off.'
      - 'We can try another way if needed.'
    faces: []
    stickers: []
