# Owned by docs/trd/prompt-engine.md
prompt:
  maxSystemTokens: 8000 # Ceiling enforced by the size test

# Owned by docs/trd/prompt-engine.md and docs/trd/memory.md
judge:
  model: 'jev-latest' # TypeSafe's Jev, release of 22 Oct 2026. Empty: no judge, so memory admits nothing
  mood: 'on' # Allows the judge to override the rule mood
  moodMinProbability: 0.3 # Threshold for the override
  memoryAdmit: 0.5 # Admission threshold
  memoryVerify: 0.5 # Verification threshold

# Owned by docs/trd/prompt-engine.md
format:
  bubbleMaxChars: 3800 # Split point for bubbles; leaves the footer room under 4,096
  maxBubbles: 1 # One text message per reply
  leakCheck: 'on' # Step 6 of the cleaning chain
  timeZone: 'Asia/Kuala_Lumpur' # Time zone of times code writes in a reply, such as /reminders

# Owned by docs/trd/tools.md
tools:
  maxCallsPerTurn: 8 # Ceiling on tool calls in one turn; each chat sets its own below it
  timeBudgetMs: 15000 # Limit on total tool time in one turn
  defaultTimeoutMs: 15000 # Timeout when a tool sets none

# Owned by docs/trd/tools.md. The host supplies the form details; empty leaves /report unavailable.
feedback:
  formUrl: ''
  referenceEntryId: ''
  pollMinutes: 5
  refTtlHours: 168

# Owned by docs/trd/tools.md
owner:
  marketsConfig: '' # The markets config the alerts timer reads, as mounted: /owner/config/markets.yaml. Host only
  claudeProjectsDir: '' # Claude Code's projects folder, mounted read-only: /owner/claude-projects. Host only
  noticeRoutesFile: '' # The session relay's routes file, as mounted: /owner/config/session_notice_routes.json. Host only
  timeoutMs: 15000 # Longest wait for one market provider call

search:
  provider: 'exa' # Web search backend: exa, or off
  pageMaxChars: 12000 # Longest page text read_page passes on
  depth:
    maxSearches: 2 # Includes the initial lookup
    maxPages: 2
    maxProviderCalls: 3 # Combined search and page read budget for the turn

# Owned by docs/trd/system.md
links:
  baseUrl: '' # HTTPS origin of the short-link Worker. Empty leaves domain-only footers
  timeoutMs: 800 # Shared time limit for shortening all sources in the reply

# Owned by docs/trd/tools.md
identify:
  timeoutMs: 6000 # Total time for upload and reverse-image search
  maxUploadBytes: 500000 # Largest local image sent to SerpApi

# Owned by docs/trd/tools.md
lessons:
  lyricsProvider: 'off' # The lyrics provider, or off

# Owned by docs/trd/tools.md
mcp:
  servers: [] # External tool servers

# Owned by docs/trd/memory.md
memory:
  enabled: 'on' # Master switch for passive memory
  episodeIdleMs: 180000 # Idle time that closes an episode
  episodeMaxMessages: 25 # Message count that closes an episode
  recallTokenBudget: 1200 # Size of recalled memory in the prompt

# Owned by docs/trd/memory.md
embeddings:
  provider: 'off' # Embedding backend for episodes and media

# Owned by docs/trd/models.md
llm:
  transport: 'api' # Selects the runner
  main: # Both transports run this model at this effort (docs/trd/models.md#providers-and-effort)
    provider: 'anthropic' # anthropic: Claude's native Messages API. Or openai-compatible
    model: 'claude-haiku-5-5' # Launch model until the benchmark in #28
    baseUrl: 'https://api.anthropic.com' # Main model endpoint URL
    effort: 'medium' # low, medium, high, xhigh or max. Empty: the model's default
    deepEffort: 'high' # Effort on a /think turn. Empty: the role's normal effort
    usdPerMTokIn: 0.1 # Price of input tokens, used when the provider reports no cost
    usdPerMTokOut: 0.5 # Price of output tokens
    usdPerMTokCached: 0.01 # Price of cached input tokens
  fallback:
    provider: 'openai-compatible' # Fallback model provider
    model: 'deepseek-ai/DeepSeek-V4.1-Flash-1017' # On ModelScope, about one credit per call
    baseUrl: 'https://api-inference.modelscope.ai/v1' # The key works on the .ai endpoint only
    effort: 'high' # Sent as reasoning_effort: none (thinking off), low, high or max
    deepEffort: 'max' # Effort on a /think turn. Empty: the role's normal effort
    usdPerMTokIn: 0 # Paid in ModelScope credit, not dollars, so not in the spend cap
    usdPerMTokOut: 0 # Price of output tokens
    usdPerMTokCached: 0 # Price of cached input tokens
  turnDeadlineMs: 45000 # Hard limit for one turn's model work
  maxRetries: 2 # Retries for a transient failure
  breakerMs: 600000 # How long a breaker stays open
  monthlyBudgetUsd: 50 # Spend cap for paid roles
  subscription: # Used only when transport is 'subscription'
    runnerUrl: 'http://127.0.0.1:9882' # The host runner service
    toolServerPort: 9883 # Port of the core's tool server for the program
    toolServerUrl: 'http://127.0.0.1:9883' # Where the program reaches that tool server

# Owned by docs/trd/models.md
media:
  watcher:
    model: 'gemini-3.5-flash-lite' # The media model, on Google AI Studio's free tier. Key: MEDIA_WATCHER_API_KEY
  # The gateway's media folders: `host` is the path in the gateway's notes, `container` is where compose mounts it
  # read-only. Empty here: the host's config.yml lists ~/.hermes/cache and ~/.hermes/audio_cache (docs/trd/deployment.md).
  gatewayDirs: []
  timeoutMs: 30000 # One media read, within two thirds of the time left in the turn deadline
  maxVideoSeconds: 300 # Longest video that is watched
  maxLinkVideoSeconds: 600 # Longest span watched from a YouTube link
  linkWatchMs: 12000 # All segment watches of one YouTube link, from the end of its lookup
  linkSegmentSeconds: 180 # One YouTube segment; a 3-minute span measured 5 s
  linkFirstSegmentSeconds: 60 # The first segment, short so the opening returns first
  maxLinkSegments: 4 # Most segments watched at once for one link
  linkFps: 0.25 # Frame rate for YouTube segments (one frame every 4 s)

# Owned by docs/trd/reliability.md
social:
  mirrors:
    tiktok: off
    reddit: off
    rednote: off
    douyin: off
    # redditGroupChatIds: [] # Optional scope for Reddit group attachments
  timeoutMs: 12000
  httpReaderTimeoutMs: 2500
  ytDlpTimeoutMs: 9000
  cacheTtlMs: 900000
  maxCacheEntries: 256
  maxTextChars: 1500
  maxReplies: 5
  maxReplyChars: 280
  ytDlpPath: yt-dlp

# Owned by docs/trd/research.md
render:
  typstPath: 'typst' # Typst CLI binary used to render report PDFs
  timeoutMs: 20000 # Longest wait for one PDF render
  maxPages: 30 # Maximum page count for a rendered report
  maxBytes: 5242880 # Maximum file size in bytes (5 MiB) for a rendered report
  report: # Default report format profile; per-chat overrides live in report.format
    pageSize: 'A4' # Page size: A4 or Letter
    accent: '#2f6fde' # Hex accent colour for headings and rules
    fontSize: 10.5 # Body font size in points (9 to 12)
    cover: true # Include a cover page before the summary
    sourcesAppendix: true # Include the numbered sources appendix at the end
    header: '' # Optional running header line

turn:
  batchMs: 1500 # Window that merges quick messages

# Owned by docs/trd/reliability.md
shutdown:
  graceMs: 20000 # Time for running turns at shutdown

# Owned by docs/trd/reliability.md
alerts:
  minGapMs: 900000 # Minimum gap between alerts of one kind

# Owned by docs/trd/records.md
records:
  retentionDays: 90 # Turn and child records
  diagnosticsHours: 72 # Verbatim failed-turn diagnostics
  windowDays: 7 # Conversation window messages
  feedbackDays: 90 # Submitted feedback answers; cleared without archival

# Owned by docs/trd/records.md
log:
  level: 'info' # Minimum log level

# Owned by docs/trd/deployment.md
gateway:
  hostDataDir: '' # The data volume's path on the host. Set at install; start-up fails while empty
  selfIds: [] # The bot's own WhatsApp ids, to tell a mention of the bot from a name call. Host only
  jobs: [] # The owner's gateway jobs the core runs, as { id, chat }. Listed in the host's file only

# Owned by docs/trd/storage.md
storage:
  path: '/data' # The data volume inside the container
  minFreeMb: 2048 # Warn level for free space
  criticalFreeMb: 512 # Critical level for free space
  checkEveryMin: 5 # How often free space is checked
  cacheMaxMb: 512 # Size cap for cache/

# Owned by docs/trd/storage.md
backup:
  everyMin: 15 # Interval between snapshots
  keepDays: 14 # How long verified snapshots stay on the data volume
  offsite:
    kind: 'off' # off, rest or s3. off until a destination is set
    checkEveryHours: 24 # Interval between restic check runs
    staleAlertMin: 60 # Age of the newest good off-host run that raises an alert

# Owned by docs/trd/storage.md
archive:
  enabled: 'on' # Export records to Parquet before they are pruned

# Owned by docs/trd/site.md
site:
  port: 9890 # The site API's port inside the container. Never the gateway's port
  allowedOrigins: [] # Origins whose browser writes are accepted. Empty: a write that carries Origin is refused

# Research (docs/trd/research.md)
research:
  maxSearches: 6
  maxPages: 8
  deadlineMs: 120000
  offerMinutes: 30
