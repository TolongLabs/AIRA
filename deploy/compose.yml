services:
  aira:
    # The image: the release by default. Before the first release an install builds one locally and names it here.
    # The updater sets AIRA_VERSION to the release it deploys, or to the previous one when it rolls back.
    image: ${AIRA_IMAGE:-ghcr.io/tolonglabs/aira}:${AIRA_VERSION:-stable}
    restart: unless-stopped
    # Longer than shutdown.graceMs in config.yml, so running turns can finish.
    stop_grace_period: 30s
    environment:
      AIRA_OWNER_API_SOCKET: /gateway/directory/owner-api.sock
    env_file: .env
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /tmp
    ports:
      # The gateway endpoint, loopback only. 9881 after cutover; a spare port while the old core still answers.
      - '127.0.0.1:${AIRA_PORT:-9881}:9881'
      # The site API, on the private-network address only (docs/trd/site.md#serving-the-api).
      - '${AIRA_SITE_BIND:-127.0.0.1}:${AIRA_SITE_PORT:-9890}:9890'
    volumes:
      # A host folder, so the gateway reads stickers and files at gateway.hostDataDir.
      - ${AIRA_DATA_DIR:-./data}:/data
      # The install's configuration, with gateway.hostDataDir set, over the image's own.
      - ./config.yml:/app/config.yml:ro
      # The gateway's media folders, read-only, for media watching (docs/trd/models.md#media-watching). They are the
      # host's ~/.hermes/cache and ~/.hermes/audio_cache, as absolute paths. Unset, an empty folder is mounted and
      # the core refuses every media path. The mount points must match `media.gatewayDirs` in config.yml.
      - ${AIRA_GATEWAY_CACHE:-./unset}:/gateway/cache:ro
      - ${AIRA_GATEWAY_AUDIO_CACHE:-./unset}:/gateway/audio_cache:ro
      # The host mirrors only names and ids here. A directory mount observes atomic replacements.
      - ${AIRA_DIRECTORY_DIR:-${HOME}/.local/share/aira/gateway-directory}:/gateway/directory:ro
      # The owner tools' host files (docs/trd/tools.md#owner-tools): a folder, so a write can replace a file atomically.
      # ~/.config/aira holds markets.yaml and session_notice_routes.json; ~/.claude/projects is read only.
      - ${AIRA_OWNER_CONFIG:-./unset}:/owner/config
      - ${AIRA_CLAUDE_PROJECTS:-./unset}:/owner/claude-projects:ro
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
