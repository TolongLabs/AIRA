services:
  rest-server:
    image: restic/rest-server:0.14.0
    restart: unless-stopped
    ports:
      - '${OFFSITE_BIND:?OFFSITE_BIND must be set}:8000:8000'
    environment:
      OPTIONS: '--append-only --private-repos --htpasswd-file /data/.htpasswd'
    volumes:
      - ${OFFSITE_DATA_DIR:-./data}:/data
