<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 404" data-layout-contract="readable-v2" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase" data-node-ui="">
