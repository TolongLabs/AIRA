<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Settings · TolongAI</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%237c7ff2'/%3E%3C/svg%3E"
    />
    <script>
      /* Pre-paint, so a dark-mode reader never gets a white flash. Migrates
         the two older storage keys on the way past. */
      (function () {
        var K = "tolongai-theme",
          old =
            localStorage.getItem("mirai-theme") ||
            localStorage.getItem("memento-theme") ||
            localStorage.getItem("brain-theme");
        if (old && !localStorage.getItem(K)) localStorage.setItem(K, old);
        localStorage.removeItem("mirai-theme");
        localStorage.removeItem("memento-theme");
        localStorage.removeItem("brain-theme");
        var t = localStorage.getItem(K);
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/settings.tsx"></script>
  </body>
</html>
