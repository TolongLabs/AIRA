<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>AIRA Chat Preview</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #d1d7db;
        --pane: #ffffff;
        --pane-2: #f0f2f5;
        --line: #e9edef;
        --text: #111b21;
        --muted: #667781;
        --wall: #efeae2;
        --in: #ffffff;
        --out: #d9fdd3;
        --accent: #008069;
        --accent-text: #ffffff;
        --link: #027eb5;
        --code-bg: rgba(17, 27, 33, 0.07);
        --note-bg: #e4e8eb;
        --note-text: #54656f;
        --err-bg: #fde8e8;
        --err-text: #b42318;
        --focus: #1a73e8;
        --shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13);
        --name-l: 36%;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #0b141a;
          --pane: #111b21;
          --pane-2: #202c33;
          --line: #222d34;
          --text: #e9edef;
          --muted: #8696a0;
          --wall: #0b141a;
          --in: #202c33;
          --out: #005c4b;
          --accent: #00a884;
          --accent-text: #0b141a;
          --link: #53bdeb;
          --code-bg: rgba(233, 237, 239, 0.12);
          --note-bg: #182229;
          --note-text: #8696a0;
          --err-bg: #3a1a1a;
          --err-text: #ff8a80;
          --focus: #8ab4f8;
          --shadow: none;
          --name-l: 66%;
        }
      }
      :root[data-theme='dark'] {
        --bg: #0b141a;
        --pane: #111b21;
        --pane-2: #202c33;
        --line: #222d34;
        --text: #e9edef;
        --muted: #8696a0;
        --wall: #0b141a;
        --in: #202c33;
        --out: #005c4b;
        --accent: #00a884;
        --accent-text: #0b141a;
        --link: #53bdeb;
        --code-bg: rgba(233, 237, 239, 0.12);
        --note-bg: #182229;
        --note-text: #8696a0;
        --err-bg: #3a1a1a;
        --err-text: #ff8a80;
        --focus: #8ab4f8;
        --shadow: none;
        --name-l: 66%;
      }

      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        overflow: hidden;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .app {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        height: 100%;
        max-width: 1500px;
        margin: 0 auto;
        background: var(--pane);
      }
      .app.has-panel {
        grid-template-columns: 340px minmax(0, 1fr) 400px;
      }

      /* Chat list */
      .list {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        border-right: 1px solid var(--line);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 60px;
        padding: 8px 12px 8px 16px;
        background: var(--pane-2);
      }
      .bar h1 {
        flex: 1;
        min-width: 0;
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }
      .bar .sub {
        display: block;
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .icon-btn {
        flex: none;
        display: inline-grid;
        place-items: center;
        min-width: 44px;
        min-height: 44px;
        padding: 0 10px;
        border: 0;
        border-radius: 22px;
        background: transparent;
        color: var(--muted);
      }
      .icon-btn:hover {
        background: var(--line);
      }
      .icon-btn svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      .chats {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .chat-item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 68px;
        padding: 10px 16px;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        text-align: left;
      }
      .chat-item:hover,
      .chat-item[aria-current='true'] {
        background: var(--pane-2);
      }
      .avatar {
        flex: none;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
      }
      .chat-text {
        flex: 1;
        min-width: 0;
      }
      .chat-title {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-weight: 600;
      }
      .chat-title time,
      .chat-last {
        font-size: 13px;
        font-weight: 400;
        color: var(--muted);
      }
      .chat-last {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .unread {
        flex: none;
        min-width: 22px;
        padding: 1px 7px;
        border-radius: 11px;
        background: var(--accent);
        color: var(--accent-text);
        font-size: 12px;
        font-weight: 600;
        text-align: center;
      }
      .tips {
        padding: 14px 16px;
        border-top: 1px solid var(--line);
        font-size: 13px;
        color: var(--muted);
      }

      /* Conversation */
      .convo {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        background: var(--wall);
      }
      .convo-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 60px;
        padding: 8px 8px 8px 8px;
        background: var(--pane-2);
      }
      .convo-head .avatar {
        margin-left: 4px;
      }
      .convo-head .who {
        flex: 1;
        min-width: 0;
      }
      .convo-head .name {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .convo-head .status {
        font-size: 13px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .convo-head .status.typing {
        color: var(--accent);
      }
      .back {
        display: none;
      }
      .head-action {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--pane);
        font-size: 13px;
        white-space: nowrap;
      }
      .head-action input {
        width: 18px;
        height: 18px;
        margin: 0;
      }
      .banner {
        padding: 8px 16px;
        background: var(--err-bg);
        color: var(--err-text);
        font-size: 13px;
      }
      .banner[hidden] {
        display: none;
      }

      .log {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 12px 5% 8px;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .empty {
        margin: auto;
        max-width: 420px;
        padding: 14px 18px;
        border-radius: 10px;
        background: var(--note-bg);
        color: var(--note-text);
        font-size: 13px;
        text-align: center;
      }
      .row {
        display: flex;
        min-width: 0;
      }
      .row.member {
        justify-content: flex-start;
      }
      .row.aira {
        justify-content: flex-end;
      }
      .row.sys {
        justify-content: center;
        margin: 6px 0;
      }
      .bubble {
        position: relative;
        max-width: min(78%, 620px);
        min-width: 64px;
        padding: 6px 9px 5px;
        border-radius: 8px;
        background: var(--in);
        box-shadow: var(--shadow);
        overflow-wrap: anywhere;
        cursor: pointer;
      }
      .aira .bubble {
        background: var(--out);
      }
      .bubble.selected {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }
      .bubble .from {
        font-size: 13px;
        font-weight: 600;
      }
      .bubble .chip {
        display: inline-block;
        margin: 0 0 2px;
        padding: 0 6px;
        border-radius: 4px;
        background: var(--code-bg);
        color: var(--link);
        font-size: 13px;
        font-weight: 600;
      }
      .quote {
        margin: 2px 0 4px;
        padding: 4px 8px;
        border-left: 4px solid var(--accent);
        border-radius: 4px;
        background: var(--code-bg);
        font-size: 13px;
      }
      .quote b {
        display: block;
        color: var(--accent);
      }
      .quote span {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        color: var(--muted);
      }
      .body > * {
        margin: 0;
      }
      .body .t {
        white-space: pre-wrap;
      }
      .body a {
        color: var(--link);
      }
      .body code {
        padding: 0 3px;
        border-radius: 3px;
        background: var(--code-bg);
        font:
          0.92em ui-monospace,
          'SFMono-Regular',
          Menlo,
          Consolas,
          monospace;
      }
      .body pre {
        margin: 2px 0;
        padding: 6px 8px;
        border-radius: 6px;
        background: var(--code-bg);
        font:
          0.92em/1.35 ui-monospace,
          'SFMono-Regular',
          Menlo,
          Consolas,
          monospace;
        white-space: pre-wrap;
      }
      .body blockquote {
        margin: 2px 0;
        padding-left: 8px;
        border-left: 4px solid var(--muted);
        white-space: pre-wrap;
        color: var(--muted);
      }
      .body ul,
      .body ol {
        margin: 2px 0;
        padding-left: 22px;
      }
      .photo {
        display: block;
        max-width: 100%;
        max-height: 320px;
        margin: 2px 0 4px;
        border-radius: 6px;
      }
      .file {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 2px 0 4px;
        padding: 8px 10px;
        border-radius: 6px;
        background: var(--code-bg);
        font-size: 13px;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 4px 8px;
        margin-top: 2px;
        font-size: 11px;
        color: var(--muted);
      }
      .turn {
        position: relative;
        padding: 0;
        border: 0;
        background: none;
        font-size: 11px;
        color: var(--link);
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .turn::after {
        content: '';
        position: absolute;
        inset: -16px -8px;
      }
      .fault {
        color: var(--err-text);
        font-weight: 600;
      }
      .react {
        position: absolute;
        right: 8px;
        bottom: -14px;
        padding: 0 5px;
        border-radius: 10px;
        background: var(--pane);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        font-size: 14px;
      }
      .row.has-react {
        margin-bottom: 12px;
      }
      .sticker {
        position: relative;
        cursor: pointer;
        padding: 2px;
        border-radius: 8px;
      }
      .sticker.selected {
        outline: 2px solid var(--focus);
      }
      .sticker img {
        display: block;
        width: 160px;
        height: 160px;
        object-fit: contain;
      }
      .sticker .meta {
        justify-content: flex-end;
      }
      .note {
        max-width: 90%;
        padding: 4px 12px;
        border-radius: 8px;
        background: var(--note-bg);
        color: var(--note-text);
        font-size: 12.5px;
        text-align: center;
        overflow-wrap: anywhere;
      }
      .note.error {
        background: var(--err-bg);
        color: var(--err-text);
        font-weight: 600;
      }
      .typing-row .bubble {
        cursor: default;
      }
      .dots {
        display: inline-flex;
        gap: 4px;
        padding: 6px 2px;
      }
      .dots i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        animation: blink 1.2s infinite both;
      }
      .dots i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dots i:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes blink {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }
        40% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dots i {
          animation: none;
        }
      }

      /* Composer */
      .composer {
        padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
        background: var(--pane-2);
      }
      .as {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 12px;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .as label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        color: var(--muted);
      }
      .as select,
      .as input[type='text'] {
        min-height: 44px;
        width: 140px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--pane);
      }
      .as input[type='checkbox'] {
        width: 20px;
        height: 20px;
        margin: 0;
      }
      .replying {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        padding: 4px 4px 4px 10px;
        border-left: 4px solid var(--accent);
        border-radius: 6px;
        background: var(--pane);
        font-size: 13px;
      }
      .replying[hidden] {
        display: none;
      }
      .replying .quote-text {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .replying b {
        color: var(--accent);
      }
      .input-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }
      .input-row textarea {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        max-height: 160px;
        padding: 10px 14px;
        border: 0;
        border-radius: 22px;
        background: var(--pane);
        resize: none;
        line-height: 1.35;
      }
      .send {
        flex: none;
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-text);
      }
      .send svg {
        width: 22px;
        height: 22px;
        fill: currentColor;
      }
      .toast {
        margin-bottom: 6px;
        padding: 6px 10px;
        border-radius: 6px;
        background: var(--err-bg);
        color: var(--err-text);
        font-size: 13px;
      }
      .toast[hidden] {
        display: none;
      }

      /* Turn record */
      .panel {
        display: none;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        border-left: 1px solid var(--line);
        background: var(--pane);
      }
      .has-panel .panel {
        display: flex;
      }
      .panel-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 4px 16px 24px;
        font-size: 13px;
      }
      .panel h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .panel h3 {
        margin: 18px 0 6px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .kv {
        display: grid;
        grid-template-columns: 110px minmax(0, 1fr);
        gap: 3px 10px;
        margin: 0;
      }
      .kv dt {
        color: var(--muted);
      }
      .kv dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .stage {
        display: grid;
        grid-template-columns: 90px minmax(0, 1fr) 64px;
        align-items: center;
        gap: 8px;
        margin: 3px 0;
      }
      .stage .bar-fill {
        height: 8px;
        border-radius: 4px;
        background: var(--accent);
        min-width: 2px;
      }
      .stage .ms {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .panel table {
        width: 100%;
        border-collapse: collapse;
      }
      .panel th,
      .panel td {
        padding: 3px 6px 3px 0;
        text-align: left;
        vertical-align: top;
        overflow-wrap: anywhere;
      }
      .panel th {
        color: var(--muted);
        font-weight: 500;
      }
      .panel .bad {
        color: var(--err-text);
      }
      .panel pre {
        margin: 6px 0 0;
        padding: 8px;
        border-radius: 6px;
        background: var(--pane-2);
        font:
          12px/1.4 ui-monospace,
          'SFMono-Regular',
          Menlo,
          Consolas,
          monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .panel summary {
        min-height: 44px;
        display: flex;
        align-items: center;
        cursor: pointer;
      }

      @media (max-width: 1100px) {
        .app.has-panel {
          grid-template-columns: 300px minmax(0, 1fr);
        }
        .has-panel .panel {
          position: fixed;
          inset: 0 0 0 auto;
          width: min(420px, 100%);
          z-index: 5;
          box-shadow: -4px 0 16px rgba(0, 0, 0, 0.25);
        }
      }
      @media (max-width: 760px) {
        .app,
        .app.has-panel {
          grid-template-columns: minmax(0, 1fr);
        }
        .list {
          border-right: 0;
        }
        .app[data-view='chat'] .list {
          display: none;
        }
        .app[data-view='list'] .convo {
          display: none;
        }
        .back {
          display: inline-grid;
        }
        .log {
          padding: 10px 10px 6px;
        }
        .bubble {
          max-width: 86%;
        }
        .has-panel .panel {
          width: 100%;
        }
        .convo-head {
          flex-wrap: wrap;
        }
        .convo-head .who {
          min-width: 120px;
        }
        #free-wrap {
          flex: 1 1 auto;
          justify-content: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app" data-view="list">
      <section class="list" aria-label="Chats">
        <div class="bar">
          <h1>
            AIRA simulator
            <span class="sub" id="level-sub"></span>
          </h1>
          <button class="icon-btn" id="theme" type="button" aria-label="Switch light or dark theme" title="Theme">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-5.4-5.4c0-1.81.89-3.42 2.26-4.4A9.1 9.1 0 0 0 12 3z"
              />
            </svg>
          </button>
        </div>
        <ul class="chats" id="chats"></ul>
        <p class="tips" id="tips"></p>
      </section>

      <section class="convo" id="convo" aria-label="Conversation">
        <header class="convo-head">
          <button class="icon-btn back" id="back" type="button" aria-label="Back to chats">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
          </button>
          <div class="avatar" id="head-avatar" aria-hidden="true"></div>
          <div class="who">
            <div class="name" id="head-name"></div>
            <div class="status" id="head-status"></div>
          </div>
          <label class="head-action" id="free-wrap" hidden>
            <input type="checkbox" id="free" />
            <span>Free response</span>
          </label>
          <button
            class="head-action"
            id="reset"
            type="button"
            hidden
            title="Start this chat again under a fresh chat id"
          >
            <span>Reset chat</span>
          </button>
        </header>
        <div class="banner" id="banner" hidden></div>
        <div class="log" id="log" role="log" aria-live="polite" aria-label="Messages"></div>
        <form class="composer" id="composer" autocomplete="off">
          <div class="toast" id="toast" role="alert" hidden></div>
          <div class="as" id="as"></div>
          <div class="replying" id="replying" hidden>
            <span class="quote-text" id="replying-text"></span>
            <button class="icon-btn" id="cancel-reply" type="button" aria-label="Cancel reply">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
                />
              </svg>
            </button>
          </div>
          <div class="input-row">
            <textarea
              id="text"
              rows="1"
              placeholder="Type a message"
              enterkeyhint="send"
              aria-label="Message"
            ></textarea>
            <button class="send" id="send" type="submit" aria-label="Send">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21 23 12 2 3v7l15 2-15 2z" /></svg>
            </button>
          </div>
        </form>
      </section>

      <aside class="panel" id="panel" aria-label="Turn record">
        <div class="bar">
          <h2 id="panel-title">Turn record</h2>
          <button class="icon-btn" id="panel-close" type="button" aria-label="Close the turn record">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
              />
            </svg>
          </button>
        </div>
        <div class="panel-body" id="panel-body"></div>
      </aside>
    </div>

    <script>
      'use strict'

      var POLL_MS = 700
      var state = { info: null, chats: [], activeId: null, replyTo: null, panelTurn: null, online: true }
      var $ = function (id) {
        return document.getElementById(id)
      }

      function esc(text) {
        return String(text == null ? '' : text).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        })
      }
      function fmtTime(iso) {
        var d = new Date(iso)
        return isNaN(d) ? '' : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      }
      function fmtMs(ms) {
        return ms < 1000 ? ms + ' ms' : (ms / 1000).toFixed(1) + ' s'
      }
      function hue(name) {
        var h = 0
        for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360
        return h
      }
      function memberColor(name) {
        return 'hsl(' + hue(name) + ', 60%, var(--name-l))'
      }
      function api(path, options) {
        return fetch(path, options).then(function (response) {
          return response.text().then(function (raw) {
            var body = null
            try {
              body = JSON.parse(raw)
            } catch (e) {}
            if (!response.ok) throw new Error((body && body.error) || 'HTTP ' + response.status)
            return body
          })
        })
      }
      function post(path, body) {
        return api(path, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body)
        })
      }
      function store(key, value) {
        try {
          if (value === undefined) return localStorage.getItem(key)
          localStorage.setItem(key, value)
        } catch (e) {}
        return null
      }

      /* Theme: follows the system until the toggle is used. */
      function applyTheme(theme) {
        if (theme) document.documentElement.setAttribute('data-theme', theme)
      }
      function currentTheme() {
        var set = document.documentElement.getAttribute('data-theme')
        if (set) return set
        return window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
      applyTheme(store('sim-theme'))
      $('theme').addEventListener('click', function () {
        var next = currentTheme() === 'dark' ? 'light' : 'dark'
        applyTheme(next)
        store('sim-theme', next)
      })

      /* Chats */
      function chatState(chat) {
        return {
          id: chat.id,
          title: chat.title,
          kind: chat.kind,
          members: chat.members,
          freeResponse: chat.freeResponse,
          msgs: new Map(),
          rev: 0,
          loaded: false,
          typing: false,
          unread: 0,
          sender: chat.members[0],
          mention: true,
          draft: ''
        }
      }
      function active() {
        return state.chats.filter(function (c) {
          return c.id === state.activeId
        })[0]
      }
      function sortedMsgs(chat) {
        return Array.from(chat.msgs.values()).sort(function (a, b) {
          return a.seq - b.seq
        })
      }
      function plainOf(m) {
        if (m.text && m.text.trim()) return m.text.replace(/\s+/g, ' ')
        if (m.sticker) return 'Sticker'
        if (m.attachment) return m.attachment.kind === 'photo' ? 'Photo' : m.attachment.name
        return m.note ? m.note.text : ''
      }
      function previewOf(m) {
        if (!m) return ''
        var who = m.kind === 'aira' ? 'AIRA: ' : m.sender ? m.sender + ': ' : ''
        return who + plainOf(m)
      }

      function renderList() {
        $('chats').innerHTML = state.chats
          .map(function (chat) {
            var msgs = sortedMsgs(chat)
            var shown = msgs.filter(function (m) {
              return m.kind !== 'note'
            })
            var last = shown[shown.length - 1]
            return (
              '<li><button type="button" class="chat-item" data-chat="' +
              esc(chat.id) +
              '" aria-current="' +
              (chat.id === state.activeId) +
              '">' +
              '<span class="avatar" aria-hidden="true">' +
              esc(chat.title.charAt(0).toUpperCase()) +
              '</span>' +
              '<span class="chat-text"><span class="chat-title"><span>' +
              esc(chat.title) +
              '</span><time>' +
              (last ? esc(fmtTime(last.at)) : '') +
              '</time></span><span class="chat-last">' +
              (chat.typing
                ? 'typing…'
                : esc(previewOf(last)) || (chat.kind === 'group' ? 'Group chat' : 'Direct chat')) +
              '</span></span>' +
              (chat.unread > 0 ? '<span class="unread">' + chat.unread + '</span>' : '') +
              '</button></li>'
            )
          })
          .join('')
      }

      function bubbleHtml(m, chat) {
        if (m.kind === 'note') {
          return (
            '<div class="row sys" data-seq="' +
            m.seq +
            '"><div class="note ' +
            esc(m.note.tone) +
            '">' +
            esc(m.note.text) +
            '</div></div>'
          )
        }
        var selected = state.replyTo && state.replyTo.id === m.id
        var meta =
          '<div class="meta">' +
          (m.turn ? turnLabel(m) : '') +
          (m.edited ? '<span>edited</span>' : '') +
          '<span>' +
          esc(fmtTime(m.at)) +
          '</span></div>'
        var react = m.reaction ? '<span class="react">' + esc(m.reaction) + '</span>' : ''
        var rowClass = 'row ' + m.kind + (m.reaction ? ' has-react' : '')
        if (m.sticker) {
          return (
            '<div class="' +
            rowClass +
            '" data-seq="' +
            m.seq +
            '"><div class="sticker' +
            (selected ? ' selected' : '') +
            '" data-id="' +
            esc(m.id) +
            '">' +
            '<img src="' +
            esc(m.sticker.url) +
            '" alt="Sticker ' +
            esc(m.sticker.name) +
            '" width="160" height="160" />' +
            meta +
            react +
            '</div></div>'
          )
        }
        var inner = ''
        if (chat.kind === 'group' && m.kind === 'member') {
          inner += '<div class="from" style="color:' + memberColor(m.sender || '') + '">' + esc(m.sender) + '</div>'
        }
        if (m.quote) {
          inner += '<div class="quote"><b>' + esc(m.quote.sender) + '</b><span>' + esc(m.quote.text) + '</span></div>'
        }
        if (m.mention) inner += '<span class="chip">@AIRA</span>'
        if (m.attachment) {
          if (m.attachment.url && m.attachment.kind === 'photo') {
            inner += '<img class="photo" src="' + esc(m.attachment.url) + '" alt="' + esc(m.attachment.name) + '" />'
          } else {
            inner +=
              '<div class="file"><span aria-hidden="true">📎</span><span>' + esc(m.attachment.name) + '</span></div>'
          }
        }
        if (m.html) inner += '<div class="body">' + m.html + '</div>'
        return (
          '<div class="' +
          rowClass +
          '" data-seq="' +
          m.seq +
          '"><div class="bubble' +
          (selected ? ' selected' : '') +
          '" data-id="' +
          esc(m.id) +
          '">' +
          inner +
          meta +
          react +
          '</div></div>'
        )
      }
      function turnLabel(m) {
        var t = m.turn
        var parts = []
        if (t.faults && t.faults.length) parts.push('<span class="fault">⚠ ' + esc(t.faults.join(', ')) + '</span>')
        var label = fmtMs(t.ms) + (t.id ? ' · ' + esc(t.id.length > 12 ? t.id.slice(-8) : t.id) : '')
        parts.push(
          t.id
            ? '<button type="button" class="turn" data-turn="' +
                esc(t.id) +
                '" title="Open the turn record ' +
                esc(t.id) +
                '">' +
                label +
                '</button>'
            : '<span>' + label + '</span>'
        )
        return parts.join('')
      }

      function nearBottom(el) {
        return el.scrollHeight - el.scrollTop - el.clientHeight < 80
      }
      function elementFor(html) {
        var t = document.createElement('template')
        t.innerHTML = html.trim()
        return t.content.firstElementChild
      }

      /* Draws the active chat. `changed` are the messages to add or replace; all of them when absent. */
      function renderLog(changed, forceBottom) {
        var chat = active()
        var log = $('log')
        if (!chat) return
        var stick = forceBottom || nearBottom(log)
        var typingEl = log.querySelector('.typing-row')
        if (!changed) {
          log.innerHTML = ''
          typingEl = null
          changed = sortedMsgs(chat)
          if (changed.length === 0) {
            log.innerHTML = '<div class="empty" data-empty>' + emptyText(chat) + '</div>'
          }
        } else if (changed.length > 0) {
          var empty = log.querySelector('[data-empty]')
          if (empty) empty.remove()
        }
        changed.forEach(function (m) {
          var el = elementFor(bubbleHtml(m, chat))
          var existing = log.querySelector('[data-seq="' + m.seq + '"]')
          if (existing) {
            existing.replaceWith(el)
            return
          }
          var after = null
          var rows = log.querySelectorAll('[data-seq]')
          for (var i = 0; i < rows.length; i++) {
            if (Number(rows[i].getAttribute('data-seq')) > m.seq) {
              after = rows[i]
              break
            }
          }
          log.insertBefore(el, after || log.querySelector('.typing-row'))
        })
        renderTyping(chat)
        if (stick) log.scrollTop = log.scrollHeight
      }
      function renderTyping(chat) {
        var log = $('log')
        var el = log.querySelector('.typing-row')
        if (chat.typing && !el) {
          el = elementFor(
            '<div class="row aira typing-row"><div class="bubble" aria-label="AIRA is typing"><span class="dots"><i></i><i></i><i></i></span></div></div>'
          )
          log.appendChild(el)
        } else if (!chat.typing && el) {
          el.remove()
        }
      }
      function emptyText(chat) {
        var who = state.info && state.info.character ? ' (' + esc(state.info.character) + ')' : ''
        var addressed =
          chat.kind === 'group'
            ? 'In a group, AIRA answers a message that mentions her or replies to her, unless free response is on.'
            : 'AIRA answers every message here.'
        return (
          'Say something to AIRA' +
          who +
          '. ' +
          addressed +
          ' Click a bubble to reply to it. Click a turn label to open its record.'
        )
      }

      function renderHead() {
        var chat = active()
        if (!chat) return
        $('head-avatar').textContent = chat.title.charAt(0).toUpperCase()
        $('head-name').textContent = chat.title
        var status = $('head-status')
        status.className = 'status' + (chat.typing ? ' typing' : '')
        status.textContent = chat.typing
          ? chat.kind === 'group'
            ? 'AIRA is typing…'
            : 'typing…'
          : chat.kind === 'group'
            ? chat.members.join(', ') + ', AIRA'
            : 'online'
        $('free-wrap').hidden = !(chat.kind === 'group' && chat.freeResponse !== undefined)
        $('free').checked = !!chat.freeResponse
        $('reset').hidden = !(state.info && state.info.canReset)
      }

      function renderComposer() {
        var chat = active()
        if (!chat) return
        var html = '<label>Send as '
        if (chat.kind === 'group') {
          html +=
            '<select id="sender">' +
            chat.members
              .map(function (n) {
                return '<option' + (n === chat.sender ? ' selected' : '') + '>' + esc(n) + '</option>'
              })
              .join('') +
            '</select></label>'
          html +=
            '<label><input type="checkbox" id="mention"' + (chat.mention ? ' checked' : '') + ' /> Mention AIRA</label>'
        } else {
          html += '<input type="text" id="sender" value="' + esc(chat.sender) + '" maxlength="40" /></label>'
        }
        $('as').innerHTML = html
        $('sender').addEventListener('change', function (e) {
          chat.sender = e.target.value
        })
        $('sender').addEventListener('input', function (e) {
          chat.sender = e.target.value
        })
        var mention = $('mention')
        if (mention) {
          mention.addEventListener('change', function (e) {
            chat.mention = e.target.checked
          })
        }
        $('text').value = chat.draft
        autosize()
        renderReply()
      }
      function renderReply() {
        var r = state.replyTo
        $('replying').hidden = !r
        if (r) $('replying-text').innerHTML = '<b>' + esc(r.sender) + '</b> ' + esc(r.text)
      }
      function autosize() {
        var t = $('text')
        t.style.height = 'auto'
        t.style.height = Math.min(t.scrollHeight, 160) + 'px'
      }

      function selectChat(id) {
        if (state.activeId !== id) state.replyTo = null
        state.activeId = id
        var chat = active()
        if (chat) chat.unread = 0
        $('app').setAttribute('data-view', 'chat')
        renderList()
        renderHead()
        renderComposer()
        renderLog(null, true)
        if (matchMedia('(min-width: 761px)').matches) $('text').focus()
      }

      /* Polling */
      function showBanner(text) {
        $('banner').hidden = !text
        $('banner').textContent = text || ''
      }
      var polling = false
      function poll() {
        if (polling || document.hidden || !state.info) return
        polling = true
        Promise.all(
          state.chats.map(function (chat) {
            var id = chat.id
            return api('/api/chats/' + encodeURIComponent(id) + '/messages?after=' + chat.rev).then(function (result) {
              // The chat may have been reset while the request was out.
              if (
                !state.chats.some(function (c) {
                  return c === chat
                })
              )
                return
              var added = []
              result.messages.forEach(function (m) {
                var isNew = !chat.msgs.has(m.seq)
                chat.msgs.set(m.seq, m)
                added.push(m)
                if (isNew && chat.loaded && chat.id !== state.activeId && m.kind !== 'member') chat.unread += 1
              })
              var typingChanged = chat.typing !== result.typing
              chat.typing = result.typing
              chat.rev = result.rev
              chat.loaded = true
              if (chat.id === state.activeId) {
                if (added.length)
                  renderLog(
                    added,
                    added.some(function (m) {
                      return m.kind === 'member' && m.sender === chat.sender
                    })
                  )
                else if (typingChanged) renderTyping(chat)
                if (typingChanged) renderHead()
              }
              if (added.length || typingChanged) renderList()
            })
          })
        )
          .then(function () {
            if (!state.online) showBanner('')
            state.online = true
          })
          .catch(function (error) {
            state.online = false
            showBanner(
              state.info.level === 2
                ? 'Cannot read the fake bridge: ' + error.message
                : 'Lost the connection to the simulator: ' + error.message
            )
          })
          .then(function () {
            polling = false
          })
      }

      /* Sending */
      function showToast(text) {
        $('toast').hidden = !text
        $('toast').textContent = text || ''
        if (text)
          setTimeout(function () {
            if ($('toast').textContent === text) showToast('')
          }, 6000)
      }
      function send() {
        var chat = active()
        if (!chat) return
        var text = $('text').value
        if (text.trim() === '') return
        var sender = (chat.sender || '').trim()
        if (!sender) return showToast('Type a name to send as.')
        var body = { sender: sender, text: text, mention: chat.kind === 'group' && chat.mention }
        if (state.replyTo) body.replyTo = state.replyTo.id
        $('text').value = ''
        chat.draft = ''
        autosize()
        state.replyTo = null
        renderReply()
        post('/api/chats/' + encodeURIComponent(chat.id) + '/send', body)
          .then(function () {
            poll()
          })
          .catch(function (error) {
            $('text').value = text
            chat.draft = text
            autosize()
            showToast(error.message)
          })
        // Pick up the new message at once; the typing indicator follows from the next poll.
        setTimeout(poll, 60)
        setTimeout(poll, 250)
      }
      $('composer').addEventListener('submit', function (e) {
        e.preventDefault()
        send()
      })
      $('text').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault()
          send()
        }
      })
      $('text').addEventListener('input', function () {
        var chat = active()
        if (chat) chat.draft = $('text').value
        autosize()
      })

      /* Reply by clicking a bubble; open a turn record by clicking its label. */
      $('log').addEventListener('click', function (e) {
        if (e.target.closest('a')) return
        // Selecting text to copy it is not a click on the bubble.
        if (String(window.getSelection()).length > 0) return
        var turn = e.target.closest('[data-turn]')
        if (turn) return openTurn(turn.getAttribute('data-turn'))
        var bubble = e.target.closest('.bubble[data-id], .sticker[data-id]')
        if (!bubble || bubble.closest('.typing-row')) return
        var chat = active()
        var id = bubble.getAttribute('data-id')
        if (state.replyTo && state.replyTo.id === id) {
          state.replyTo = null
        } else {
          var m = sortedMsgs(chat).filter(function (x) {
            return x.id === id
          })[0]
          if (!m) return
          state.replyTo = { id: m.id, sender: m.kind === 'aira' ? 'AIRA' : m.sender, text: plainOf(m) || '…' }
          $('text').focus()
        }
        renderReply()
        renderLog(null, false)
      })
      $('cancel-reply').addEventListener('click', function () {
        state.replyTo = null
        renderReply()
        renderLog(null, false)
      })

      $('chats').addEventListener('click', function (e) {
        var item = e.target.closest('[data-chat]')
        if (item) selectChat(item.getAttribute('data-chat'))
      })
      $('back').addEventListener('click', function () {
        $('app').setAttribute('data-view', 'list')
      })

      $('reset').addEventListener('click', function () {
        var chat = active()
        post('/api/chats/' + encodeURIComponent(chat.id) + '/reset', {})
          .then(function (result) {
            var fresh = chatState(result.chat)
            fresh.sender = chat.sender
            fresh.mention = chat.mention
            state.chats[state.chats.indexOf(chat)] = fresh
            state.replyTo = null
            state.activeId = fresh.id
            closePanel()
            renderList()
            renderHead()
            renderComposer()
            renderLog(null, true)
          })
          .catch(function (error) {
            showToast(error.message)
          })
      })
      $('free').addEventListener('change', function (e) {
        var chat = active()
        var value = e.target.checked
        post('/api/chats/' + encodeURIComponent(chat.id) + '/free-response', { value: value })
          .then(function () {
            chat.freeResponse = value
          })
          .catch(function (error) {
            e.target.checked = !value
            showToast(error.message)
          })
      })

      /* Turn record panel */
      function openTurn(id) {
        state.panelTurn = id
        $('app').classList.add('has-panel')
        $('panel-body').innerHTML = '<p>Loading…</p>'
        api('/api/turn/' + encodeURIComponent(id))
          .then(function (panel) {
            if (state.panelTurn === id) $('panel-body').innerHTML = renderTurn(panel)
          })
          .catch(function (error) {
            if (state.panelTurn === id) $('panel-body').innerHTML = '<p class="bad">' + esc(error.message) + '</p>'
          })
      }
      function closePanel() {
        state.panelTurn = null
        $('app').classList.remove('has-panel')
      }
      $('panel-close').addEventListener('click', closePanel)
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return
        if (state.panelTurn) closePanel()
        else if (state.replyTo) {
          state.replyTo = null
          renderReply()
          renderLog(null, false)
        }
      })

      function val(v) {
        return v === null || v === undefined || v === '' ? '-' : esc(v)
      }
      function renderTurn(p) {
        var s = p.summary
        var out = '<h3>Summary</h3><dl class="kv">'
        var rows = [
          ['Turn', p.id],
          ['State', s.state + (s.outcome && s.outcome !== s.state ? ' (' + s.outcome + ')' : '')],
          ['Kind', s.kind],
          ['Character', s.character],
          ['Mood', s.mood ? s.mood + (s.moodSource ? ' (' + s.moodSource + ')' : '') : null],
          ['Model', s.model ? s.model + ' · ' + (s.transport || '') + ' · ' + (s.role || '') : null],
          ['Attempts', s.attempts],
          [
            'Tokens',
            (s.inputTokens || 0) + ' in, ' + (s.outputTokens || 0) + ' out, ' + (s.cachedTokens || 0) + ' cached'
          ],
          ['Cost', typeof s.costUsd === 'number' ? '$' + s.costUsd.toFixed(4) : null],
          ['Reply', s.replyChars != null ? s.replyChars + ' chars, ' + (s.bubbleCount || 0) + ' bubbles' : null],
          ['Sticker', s.sticker]
        ]
        rows.forEach(function (r) {
          out += '<dt>' + r[0] + '</dt><dd>' + val(r[1]) + '</dd>'
        })
        out += '</dl><h3>Stage timings</h3>'
        var max = Math.max.apply(
          null,
          p.stages
            .map(function (x) {
              return x.ms
            })
            .concat([1])
        )
        out += p.stages.length
          ? p.stages
              .map(function (x) {
                return (
                  '<div class="stage"><span>' +
                  esc(x.stage) +
                  '</span><span><div class="bar-fill" style="width:' +
                  Math.max(2, Math.round((x.ms / max) * 100)) +
                  '%"></div></span><span class="ms">' +
                  fmtMs(x.ms) +
                  '</span></div>'
                )
              })
              .join('')
          : '<p>No stage times.</p>'
        out += '<h3>Model calls</h3>'
        out += p.modelCalls.length
          ? '<table><tr><th>Model</th><th>Try</th><th>Time</th><th>Tokens</th></tr>' +
            p.modelCalls
              .map(function (c) {
                return (
                  '<tr><td>' +
                  val(c.model) +
                  (c.failure ? '<br><span class="bad">' + esc(c.failure) + '</span>' : '') +
                  '</td><td>' +
                  val(c.attempt) +
                  '</td><td>' +
                  (c.durationMs != null ? fmtMs(c.durationMs) : '-') +
                  '</td><td>' +
                  (c.inputTokens || 0) +
                  '/' +
                  (c.outputTokens || 0) +
                  '</td></tr>'
                )
              })
              .join('') +
            '</table>'
          : '<p>None.</p>'
        out += '<h3>Tool calls</h3>'
        out += p.toolCalls.length
          ? '<table><tr><th>Tool</th><th>Source</th><th>Outcome</th><th>Time</th></tr>' +
            p.toolCalls
              .map(function (c) {
                return (
                  '<tr><td>' +
                  val(c.tool) +
                  '</td><td>' +
                  val(c.source) +
                  '</td><td>' +
                  val(c.outcome) +
                  '</td><td>' +
                  (c.durationMs != null ? fmtMs(c.durationMs) : '-') +
                  '</td></tr>'
                )
              })
              .join('') +
            '</table>'
          : '<p>None.</p>'
        out += '<h3>Failures</h3>'
        out += p.failures.length
          ? p.failures
              .map(function (f) {
                return (
                  '<p class="bad"><b>' +
                  val(f.kind) +
                  '</b> at ' +
                  val(f.stage) +
                  ' (handled by ' +
                  val(f.handledBy) +
                  ')<br>' +
                  val(f.message) +
                  '</p>'
                )
              })
              .join('')
          : '<p>None.</p>'
        out += '<details><summary>Raw record</summary><pre>' + esc(p.text) + '</pre></details>'
        return out
      }

      /* Start */
      function start() {
        api('/api/info')
          .then(function (info) {
            state.info = info
            state.chats = info.chats.map(chatState)
            $('level-sub').textContent =
              info.level === 1
                ? 'Level 1 · core in process' + (info.character ? ' · ' + info.character : '')
                : 'Level 2 · reads the fake bridge'
            $('tips').textContent =
              info.level === 1
                ? 'Each message goes to the real core as the gateway would send it. Reset chat starts a fresh chat id.'
                : 'Messages go to the fake bridge; a staging gateway answers through it.'
            renderList()
            if (state.chats.length) selectChat(state.chats[0].id)
            $('app').setAttribute('data-view', matchMedia('(min-width: 761px)').matches ? 'chat' : 'list')
            setInterval(poll, POLL_MS)
          })
          .catch(function (error) {
            $('chats').innerHTML = '<li class="tips">' + esc(error.message) + '</li>'
          })
      }
      start()
    </script>
  </body>
</html>
